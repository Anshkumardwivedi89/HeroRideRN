name: Build Sideloadable iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build Unsigned IPA for Sideloadly
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode 26 (Swift 6.2+)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_26.3.app" ]; then
            echo "Selecting Xcode 26.3"
            sudo xcode-select -s /Applications/Xcode_26.3.app
            echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            echo "Selecting Xcode 26.0"
            sudo xcode-select -s /Applications/Xcode_26.0.app
            echo "DEVELOPER_DIR=/Applications/Xcode_26.0.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_26.app" ]; then
            echo "Selecting Xcode 26"
            sudo xcode-select -s /Applications/Xcode_26.app
            echo "DEVELOPER_DIR=/Applications/Xcode_26.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting default Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          fi

          xcodebuild -version
          swift -version

      - name: Clean Cache and Build State
        run: |
          rm -rf ios/build
          rm -rf ios/Pods
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Build and Package IPA
        run: |
          cd ios
          mkdir -p build/Payload

          # Find the generated workspace
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"

          # Build Development Client .app bundle with Debug configuration
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          # Copy built .app into Payload directory
          cp -r build/DerivedData/Build/Products/Debug-iphoneos/*.app build/Payload/

          # Package Payload into .ipa archive
          cd build
          zip -r HeroRide.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRide-iOS-IPA
          path: ios/build/HeroRide.ipa
          retention-days: 7
